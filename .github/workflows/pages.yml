name: pages
# Publish the browser tracker: music-styles-as-trackers/ as the site root,
# so its pages and the song, style, and schema files they load keep their paths.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test before publishing
        working-directory: music-styles-as-trackers
        run: |
          npm ci
          npm run validate
          npm test
      - name: Assemble the site
        run: rsync -a --exclude node_modules --exclude demo-out music-styles-as-trackers/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
